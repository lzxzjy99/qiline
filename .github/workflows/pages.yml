name: Publish Qiline to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ONLINE_URL: https://qiline-online.one-vote.workers.dev/online.html
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the static website
        run: npm run build:static
      - name: Prepare the Pages copy
        run: |
          node --input-type=module <<'NODE'
          import {readFile, writeFile, rm} from 'node:fs/promises';
          const url = process.env.ONLINE_URL;
          for (const file of ['dist/index.html', 'dist/test-records.html']) {
            const html = await readFile(file, 'utf8');
            await writeFile(file, html.replaceAll('href="./online.html"', `href="${url}"`));
          }
          await writeFile('dist/online.html', `<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=${url}"><title>在线对战 · 弈合</title><a href="${url}">进入弈合在线对战</a></html>`);
          await writeFile('dist/.nojekyll', '');
          // Only remove the generated Worker bundle in this Linux CI workspace.
          await rm('dist/server', {recursive: true, force: true});
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
